<!DOCTYPE html>

<head>

<title>페이지를 찾을 수 없습니다 | Data Science Lab</title>

<link rel="stylesheet" href="/_ds/data-science-lab-design-system-746dee96-35ff-4cd6-b946-f15666ad4921/tokens/typography.css">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: 'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #1f2937; min-height: 100vh; display: flex; flex-direction: column; }
  header { border-bottom: 1px solid #e5e8ef; }
  header a { display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 clamp(16px, 4vw, 40px); max-width: 1240px; margin: 0 auto; text-decoration: none; color: inherit; box-sizing: border-box; }
  header img { height: 30px; width: auto; display: block; }
  header b { font-size: 13.5px; font-weight: 700; letter-spacing: 0.05em; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(48px, 8vw, 96px) 20px; }
  .box { max-width: 520px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .code { font-size: clamp(56px, 10vw, 88px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: #4060a8; }
  h1 { margin: 0; font-size: clamp(20px, 3vw, 26px); font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 15px; line-height: 1.7; color: #4b5563; }
  .btn { display: inline-flex; align-items: center; justify-content: center; margin-top: 10px; padding: 11px 22px; border-radius: 10px; background: #4060a8; color: #ffffff; font-weight: 600; font-size: 14.5px; text-decoration: none; }
  .btn:hover { background: #33508e; }
  footer { border-top: 1px solid #e5e8ef; background: #f8f9fb; padding: 24px 20px; text-align: center; font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
  <header><a href="/"><img src="/assets/dsl-mark.png" alt="Data Science Lab"><b>DATA SCIENCE LAB</b></a></header>
  <main>
    <div class="box">
      <div class="code">404</div>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>주소가 잘못되었거나 페이지가 이동했을 수 있습니다.<br>홈으로 돌아가 메뉴에서 원하는 페이지를 찾아주세요.</p>
      <a class="btn" href="/">홈으로 가기</a>
    </div>
  </main>
  <footer>© 2026 Data Science Lab. All rights reserved.</footer>
</body>
